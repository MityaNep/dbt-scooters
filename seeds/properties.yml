version: 2

seeds:
  - name: "scooters"
    description: "Scooter models info and statistics"
    config:
      delimiter: ","
  - name: "event_types"
    description: "Types of event"
    config:
      delimiter: ";"
  - name: "age_groups"
    description: "Groups by age"
    columns:
      - name: "group"
        description: "Age group name for report"
        data_tests: [ "unique_not_null" ]
      - name: "age_start"
        description: "Start age of group"
        data_tests: [ "unique_not_null" ]
      - name: "age_end"
        description: "End age of group"
        data_tests: [ "unique_not_null" ]