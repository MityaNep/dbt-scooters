version: 2

sources:
  - name: "scooters_raw"
    description: "Raw data provided by scooters service"
    loader: "https://t.me/inzhenerka_dbt_bot"
    tables:
      - name: "trips"
        description: "Scooter trips"

      - name: "users"
        description: "Users of scooter service"

      - name: "events"
        description: "Raw user events with duplicates"
models:
  - name: "trips_prep"
    description: "Trips prepared for analysis"
    config:
      materialized: "view"
  - name: "trips_stat"
    description: "Overall trips statistics"
  - name: "trips_stat_daily"
    description: "Overall trips daily statistics"
    config:
      indexes:
        - columns: ["date"]
  - name: "trips_age_daily"
    description: "Dayly statistics by age"
  - name: "trips_age_daily_stat"
    description: "Statistics by age"
  - name: "trips_geom"
    description: "trips geolocation"
    config:
      materialized: "view"
  - name: "parking_start_stat"
    description: "Parcking start statistics by 500 m hexagons"
  - name: "parking_finish_stat"
    description: "Parcking finish statistics by 10 m hexagons"
  - name: "trips_users"
    description: "Trips"
    config:
      materialized: "incremental"
  - name: "events_clean"
    description: "User events without duplicates"
    config:
      materialized: "incremental"