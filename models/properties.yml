version: 2

sources:
  - name: "scooters_raw"
    description: "Raw data provided by scooters service"
    loader: "https://t.me/inzhenerka_dbt_bot"
    tables:
      - name: "trips"
        description: "Scooter trips"
        loaded_at_field: "finished_at"
        freshness:
          warn_after:
            count: 1
            period: "day"
          error_after:
            count: 3650
            period: "day"
        columns:
          - name: "user_id"
            description: "User identifier"
            data_tests:
              - not_null
              - relationships:
                  arguments: 
                    name: "every_trip_has_user"
                    to: "source('scooters_raw', 'users')"
                    field: "id"

      - name: "users"
        description: "Users of scooter service"
        columns:
          - name: "sex"
            description: "User gender"
            data_tests:
              - accepted_values:
                  arguments:
                    values: [ "M", "F" ]
              - not_null:
                  config:
                    severity: "warn"

      - name: "events"
        description: "Raw user events with duplicates"
models:
  - name: "trips_prep"
    description: "Trips prepared for analysis"
    config:
      materialized: "view"
  - name: "trips_stat"
    description: "Overall trips statistics"
  - name: "trips_stat_daily"
    description: "Overall trips daily statistics"
    config:
      indexes:
        - columns: ["date"]
  - name: "trips_age_daily"
    description: "Dayly statistics by age"
    data_tests:
      - unique:
          arguments:
            column_name: "date::text || age::text"
      - unique_key:
          arguments:
            columns: [ "date", "age" ]
  - name: "trips_age_daily_stat"
    description: "Statistics by age"
  - name: "trips_geom"
    description: "trips geolocation"
    config:
      materialized: "view"
  - name: "parking_start_stat"
    description: "Parcking start statistics by 500 m hexagons"
  - name: "parking_finish_stat"
    description: "Parcking finish statistics by 10 m hexagons"
  - name: "trips_users"
    description: "Trips"
    config:
      materialized: "incremental"
      post_hook:
        - "analyze dbt.trips_users"
        - sql: "vacuum dbt.trips_users"
          transaction: false
  - name: "events_clean"
    description: "User events without duplicates"
    config:
      materialized: "incremental"
      strategy: "merge"
      unique_key: [ "user_id", "timestamp", "type_id" ]
  - name: "trips_concurrency"
    description: "trips concurrency"
    config:
      materialized: "incremental"
  - name: "companies"
    description: "Scooter companies"
  - name: "companies_trips"
    description: "Trip satistics by company"
    columns:
      - name: "company"
        description: "Scooters manufacturing company"
        data_tests:
          - unique
  - name: "events_full"
    description: "Events with name of type"
    config:
      materialized: "view"
  - name: "events_stat"
    description: "Overall user events statistics"
  - name: "trips_age_group"
    description: "Trip statistic by age group"